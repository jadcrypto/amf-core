[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amf-core"
version = "0.2.0"
description = "Atomic Model Fragmentation (AMF) — Molecular Inference Engine for resource-constrained hardware"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Jad", email = "jadjbara@live.com" }
]
keywords = [
    "llm", "inference", "gguf", "quantization",
    "molecular-inference", "edge-ai", "low-memory",
    "transformer", "fragmentation", "amf"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "gguf>=0.6.0",
    "rich>=13.0.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
safetensors = [
    "safetensors>=0.4.0",
    "huggingface_hub>=0.20.0",
    "transformers>=4.40.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "flake8",
    "build",
    "twine",
]

[project.urls]
"Homepage"    = "https://github.com/jadcrypto/amf-core"
"Repository"  = "https://github.com/jadcrypto/amf-core"
"Bug Tracker" = "https://github.com/jadcrypto/amf-core/issues"
"PyPI"        = "https://pypi.org/project/amf-core/"

[project.scripts]
amf = "main:main"

[tool.setuptools]
py-modules = ["amf", "config", "main"]

[tool.setuptools.packages.find]
include  = ["core*", "engine*", "cli*"]
exclude  = ["tests*", "docs*", "*.bak"]

[tool.black]
line-length    = 100
target-version = ["py310", "py311", "py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
