[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amf-core"
version = "0.1.0"
description = "Atomic Model Fragmentation (AMF) - Universal LLM Decomposition Library"
readme = "README.md"
authors = [
    { name = "Jad", email = "jad@example.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
    "gguf>=0.6.0",
    "rich>=13.0.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
safetensors = [
    "safetensors>=0.4.0",
    "huggingface_hub>=0.20.0"
]
dev = [
    "pytest",
    "black",
    "flake8",
    "build",
    "twine"
]

[project.urls]
"Homepage" = "https://github.com/yourusername/amf-core"
"Bug Tracker" = "https://github.com/yourusername/amf-core/issues"

[project.scripts]
amf = "main:main"

[tool.setuptools]
py-modules = ["amf", "config", "main"]

[tool.setuptools.packages.find]
include = ["core*", "engine*", "cli*"]
exclude = ["tests*", "docs*"]
